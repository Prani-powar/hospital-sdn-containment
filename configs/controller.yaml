schema_version: 1
policy_version: 1
poll_interval_s: 1.0
poll_timeout_s: 2.5
max_snapshot_age_s: 3.5
send_timeout_s: 0.1
guard_cooldown_s: 0.5
poll_core: false
max_rows_per_switch: 2048
max_multipart_parts: 32
max_api_rows: 4096
normal_idle_timeout_s: 30
normal_hard_timeout_s: 120
hard_timeout_jitter_s: 30
normal_rule_limit_per_switch: 1024
packet_in_rate: 2000
packet_in_burst: 2000
source_packet_in_rate: 200
source_packet_in_burst: 200
flow_mod_rate: 400
flow_mod_burst: 400
observation_limit: 512
